name: Make Experimental Release

on: [workflow_dispatch]

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if git diff --name-only HEAD^ HEAD | grep -E '\.(cpp|h|hpp|cmake)$|CMakeLists\.txt'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: build
    needs: check-changes
    if: needs: check-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        config: [Release]
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Upload Compiled Files
        uses: actions/upload-artifact@v4
        with:
          name: RE-UE4SS-Experimental-Build
          path: |
            build/Output/Release/
            build/bin/
